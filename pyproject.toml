[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "standup-gen"
version = "0.1.0"
description = "Auto-generate your daily standup from git history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["git", "standup", "productivity", "developer-tools", "scrum", "agile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/mansourmatta/standup-gen"
Repository = "https://github.com/mansourmatta/standup-gen"
"Bug Tracker" = "https://github.com/mansourmatta/standup-gen/issues"

[project.scripts]
standup-gen = "standup_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["standup_gen*"]
